<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无限草地 · 参数面板 · 配置保存</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }

  /* ============ HUD ============ */
  #hud {
    position: fixed; top: 12px; left: 12px;
    background: rgba(15, 25, 15, 0.85); color: #d5e8d5;
    padding: 10px 14px; border-radius: 8px;
    font-size: 11px; font-variant-numeric: tabular-nums;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(143, 223, 111, 0.15);
    line-height: 1.65; min-width: 210px; z-index: 10;
  }
  #hud b { color: #8fdf6f; font-weight: 600; }
  #hud .mode { color: #ff9a5a; }
  #hud .fps { color: #8ac0ff; }

  /* ============ 参数按钮 ============ */
  #openPanel {
    position: fixed; top: 12px; right: 12px;
    padding: 9px 18px; border-radius: 6px;
    background: linear-gradient(135deg, #4a8a3a, #6ab04c);
    color: #fff; border: none; font-size: 12px; font-weight: 600;
    cursor: pointer; z-index: 20; letter-spacing: 0.5px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    transition: opacity 0.15s, transform 0.15s;
  }
  #openPanel:hover { opacity: 0.9; transform: translateY(-1px); }

  /* ============ 参数面板（右侧抽屉） ============ */
  #panel {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 340px; max-width: 100vw;
    background: rgba(15, 25, 15, 0.97);
    color: #d5e8d5;
    display: flex; flex-direction: column;
    transform: translateX(105%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 30;
    backdrop-filter: blur(14px);
    border-left: 1px solid rgba(143, 223, 111, 0.2);
    box-shadow: -10px 0 30px rgba(0,0,0,0.4);
  }
  #panel.open { transform: translateX(0); }

  #panel header {
    padding: 14px 16px 10px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(143, 223, 111, 0.15);
    flex-shrink: 0;
  }
  #panel h2 { font-size: 14px; font-weight: 600; color: #8fdf6f; }
  #closePanel {
    background: transparent; border: none; color: #aac; font-size: 22px;
    cursor: pointer; line-height: 1; padding: 0 4px;
    transition: color 0.15s;
  }
  #closePanel:hover { color: #8fdf6f; }

  #panelContent {
    flex: 1; overflow-y: auto; padding: 6px 16px 10px;
    min-height: 0;
  }
  #panelContent::-webkit-scrollbar { width: 6px; }
  #panelContent::-webkit-scrollbar-thumb { background: #3a5a3a; border-radius: 3px; }

  #panel footer {
    padding: 10px 16px 14px;
    border-top: 1px solid rgba(143, 223, 111, 0.15);
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    flex-shrink: 0;
  }
  #panel footer select, #panel footer button {
    padding: 7px 10px; font-size: 11px;
    background: #1a2a1a; color: #d5e8d5;
    border: 1px solid #3a5a3a; border-radius: 4px;
    cursor: pointer; font-family: inherit;
    transition: background 0.15s, border-color 0.15s;
  }
  #panel footer button:hover, #panel footer select:hover {
    background: #2a4a2a; border-color: #6ab04c;
  }
  #panel footer button.primary {
    background: linear-gradient(135deg, #4a8a3a, #6ab04c);
    border-color: #6ab04c; color: #fff; font-weight: 600;
  }
  #panel footer button.primary:hover { opacity: 0.85; }
  #panel footer .full { grid-column: 1 / -1; }

  /* ============ 参数行 ============ */
  .group-title {
    font-size: 10px; color: #6a9a5a; text-transform: uppercase;
    letter-spacing: 1px; margin: 14px 0 6px 0; padding-top: 8px;
    border-top: 1px solid rgba(143, 223, 111, 0.1);
  }
  .group-title:first-child { border-top: none; padding-top: 0; margin-top: 4px; }

  .param-row {
    display: grid;
    grid-template-columns: 88px 1fr 48px;
    gap: 6px; align-items: center; margin-bottom: 7px;
    font-size: 11px;
  }
  .param-row label { opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .param-row input[type="range"] {
    width: 100%; height: 4px; background: #2a4a2a;
    border-radius: 2px; outline: none; -webkit-appearance: none;
  }
  .param-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px;
    background: #8fdf6f; border-radius: 50%; cursor: pointer;
    box-shadow: 0 0 6px rgba(143,223,111,0.5);
  }
  .param-row input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; background: #8fdf6f;
    border-radius: 50%; cursor: pointer; border: none;
  }
  .param-row input[type="color"] {
    width: 100%; height: 22px; border: 1px solid #3a5a3a;
    background: transparent; cursor: pointer; border-radius: 4px;
    padding: 1px;
  }
  .param-row input[type="checkbox"] {
    width: 15px; height: 15px; cursor: pointer; accent-color: #8fdf6f;
    justify-self: start;
  }
  .param-row .param-val {
    font-size: 10px; text-align: right; color: #8fdf6f;
    font-variant-numeric: tabular-nums; overflow: hidden;
    white-space: nowrap;
  }
  .param-row .span2 { grid-column: span 2; }

  /* ============ 遮罩 ============ */
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0);
    pointer-events: none; z-index: 25;
    transition: background 0.3s;
  }
  #overlay.open {
    background: rgba(0,0,0,0.25);
    pointer-events: auto;
  }

  /* ============ Toast ============ */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: rgba(30, 60, 30, 0.96);
    color: #8fdf6f; padding: 10px 22px;
    border-radius: 6px; font-size: 12px;
    z-index: 100; border: 1px solid rgba(143,223,111,0.3);
    animation: toastIn 0.2s ease;
    font-variant-numeric: tabular-nums;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
</style>
</head>
<body>

<div id="hud">
  <div>模式 <span class="mode" id="hud-mode">第三人称</span> · <span class="fps" id="hud-fps">0</span> fps</div>
  <div>位置 <b id="hud-pos">0, 0</b></div>
  <div>Chunk <b id="hud-chunks">0</b> / 可见 <b id="hud-visible">0</b></div>
  <div>草叶 <b id="hud-blades">0</b></div>
</div>

<button id="openPanel">⚙️ 参数</button>

<div id="overlay"></div>

<aside id="panel">
  <header>
    <h2>动态参数</h2>
    <button id="closePanel">×</button>
  </header>
  <div id="panelContent"></div>
  <footer>
    <select id="presetSelect" class="full">
      <option value="">— 选择预设 —</option>
      <option value="default">默认</option>
      <option value="sunset">黄昏</option>
      <option value="storm">暴风雨</option>
      <option value="night">夜晚</option>
      <option value="alien">异星</option>
    </select>
    <button id="saveBtn" class="primary">💾 保存</button>
    <button id="resetBtn">↺ 重置</button>
    <button id="exportBtn">📤 导出</button>
    <button id="importBtn">📥 导入</button>
  </footer>
</aside>

<input type="file" id="importFile" accept=".json,application/json" style="display:none">

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ============================================================
// 默认配置
// ============================================================
const defaultConfig = {
  // 草地
  bladesPerChunk: 2500,
  chunkSize: 8,
  chunkRadius: 4,
  size: 0.8,
  height: 1.2,
  colorTop: '#9bdd55',
  colorBottom: '#1e3d10',
  ambient: 0.55,

  // 风
  windStrength: 0.8,
  windSpeed: 1.0,
  shake: 1.2,
  windAngle: 30,
  windDirRate: 0.6,

  // 球推开草地
  radius: 2.5,
  push: 1.8,
  gravity: 0.3,

  // 小球
  ballSpeed: 10,
  hoverHeight: 0.5,
  ballVisualRadius: 0.5,
  ballColor: '#ff5533',

  // 相机
  camDistance: 8,
  fpEyeHeight: 0.55,
  cameraFov: 60,

  // 环境光照
  sunAngle: 45,
  sunElevation: 60,
  sunIntensity: 1.3,
  sunColor: '#fff5e0',
  ambientLightIntensity: 0.7,
  ambientLightColor: '#8899aa',
  skyColor: '#a8cfe8',
  fogColor: '#a8cfe8',
  fogNear: 45,
  fogFar: 180,

  // 渲染剔除
  cullFrustum: true,
  cullDistance: true,
};

const presets = {
  default: { ...defaultConfig },
  sunset: {
    ...defaultConfig,
    colorTop: '#ffaa55', colorBottom: '#aa3311',
    skyColor: '#ff8866', fogColor: '#ff8866', fogNear: 30, fogFar: 150,
    sunColor: '#ff9944', sunAngle: 270, sunElevation: 15, sunIntensity: 2.0,
    ambientLightColor: '#aa6644', ambientLightIntensity: 0.6,
    windStrength: 0.5,
  },
  storm: {
    ...defaultConfig,
    windStrength: 1.8, windSpeed: 2.0, shake: 2.2, windDirRate: 1.0,
    skyColor: '#556677', fogColor: '#556677', fogNear: 20, fogFar: 120,
    sunIntensity: 0.6, ambientLightIntensity: 0.5,
    colorTop: '#5a8a3a', colorBottom: '#0a1a08',
  },
  night: {
    ...defaultConfig,
    colorTop: '#448855', colorBottom: '#112211',
    skyColor: '#0a1a2a', fogColor: '#0a1a2a', fogNear: 20, fogFar: 100,
    sunColor: '#4455aa', sunAngle: 200, sunElevation: 70, sunIntensity: 0.3,
    ambientLightColor: '#223344', ambientLightIntensity: 0.5,
    ballColor: '#88ddff',
  },
  alien: {
    ...defaultConfig,
    colorTop: '#88ddff', colorBottom: '#2244aa',
    skyColor: '#334466', fogColor: '#334466', fogNear: 40, fogFar: 200,
    sunColor: '#aaccff', sunElevation: 80, sunIntensity: 1.6,
    ambientLightColor: '#445566', ambientLightIntensity: 0.8,
    ballColor: '#ff44aa',
  },
};

// ============================================================
// 参数 Schema（驱动 UI 生成）
// ============================================================
const schema = [
  {
    title: '草地',
    items: [
      { key: 'bladesPerChunk', label: '每块草数', type: 'range', min: 500, max: 10000, step: 100, rebuild: 'full', format: v => (v/1000).toFixed(1) + 'k' },
      { key: 'chunkSize', label: '块大小', type: 'range', min: 4, max: 20, step: 1, rebuild: 'full', format: v => v.toFixed(0) },
      { key: 'chunkRadius', label: '可见半径', type: 'range', min: 1, max: 10, step: 1, rebuild: 'refresh', format: v => v.toFixed(0) },
      { key: 'size', label: '草大小', type: 'range', min: 0.2, max: 1.5, step: 0.05, rebuild: 'full' },
      { key: 'height', label: '草高度', type: 'range', min: 0.3, max: 3, step: 0.05, rebuild: 'full' },
      { key: 'colorTop', label: '草顶色', type: 'color' },
      { key: 'colorBottom', label: '草底色', type: 'color' },
      { key: 'ambient', label: '草地环境光', type: 'range', min: 0, max: 1, step: 0.01 },
    ],
  },
  {
    title: '风',
    items: [
      { key: 'windStrength', label: '风力强度', type: 'range', min: 0, max: 3, step: 0.05 },
      { key: 'windSpeed', label: '风速', type: 'range', min: 0, max: 3, step: 0.05 },
      { key: 'shake', label: '摆动幅度', type: 'range', min: 0, max: 3, step: 0.05 },
      { key: 'windAngle', label: '风向角度', type: 'range', min: 0, max: 360, step: 1, format: v => v.toFixed(0) + '°' },
      { key: 'windDirRate', label: '倾倒程度', type: 'range', min: 0, max: 2, step: 0.05 },
    ],
  },
  {
    title: '球推开草地',
    items: [
      { key: 'radius', label: '影响半径', type: 'range', min: 0, max: 6, step: 0.1 },
      { key: 'push', label: '推开强度', type: 'range', min: 0, max: 3, step: 0.1 },
      { key: 'gravity', label: '重力下垂', type: 'range', min: 0, max: 2, step: 0.05 },
    ],
  },
  {
    title: '小球',
    items: [
      { key: 'ballSpeed', label: '移动速度', type: 'range', min: 0.5, max: 40, step: 0.5 },
      { key: 'hoverHeight', label: '悬浮高度', type: 'range', min: 0, max: 3, step: 0.05 },
      { key: 'ballVisualRadius', label: '视觉半径', type: 'range', min: 0.2, max: 2, step: 0.05 },
      { key: 'ballColor', label: '小球颜色', type: 'color' },
    ],
  },
  {
    title: '相机',
    items: [
      { key: 'camDistance', label: '相机距离', type: 'range', min: 2.5, max: 30, step: 0.5 },
      { key: 'fpEyeHeight', label: '第一人称眼高', type: 'range', min: 0.2, max: 2, step: 0.05 },
      { key: 'cameraFov', label: '视野 FOV', type: 'range', min: 30, max: 100, step: 1, format: v => v.toFixed(0) + '°' },
    ],
  },
  {
    title: '环境光照',
    items: [
      { key: 'sunAngle', label: '太阳方位', type: 'range', min: 0, max: 360, step: 1, format: v => v.toFixed(0) + '°' },
      { key: 'sunElevation', label: '太阳高度', type: 'range', min: 5, max: 90, step: 1, format: v => v.toFixed(0) + '°' },
      { key: 'sunIntensity', label: '阳光强度', type: 'range', min: 0, max: 3, step: 0.05 },
      { key: 'sunColor', label: '阳光颜色', type: 'color' },
      { key: 'ambientLightIntensity', label: '环境光强', type: 'range', min: 0, max: 2, step: 0.05 },
      { key: 'ambientLightColor', label: '环境光色', type: 'color' },
      { key: 'skyColor', label: '天空颜色', type: 'color' },
      { key: 'fogColor', label: '雾颜色', type: 'color' },
      { key: 'fogNear', label: '雾近距', type: 'range', min: 0, max: 200, step: 5, format: v => v.toFixed(0) },
      { key: 'fogFar', label: '雾远距', type: 'range', min: 50, max: 500, step: 5, format: v => v.toFixed(0) },
    ],
  },
  {
    title: '渲染剔除',
    items: [
      { key: 'cullFrustum', label: '视锥剔除', type: 'checkbox' },
      { key: 'cullDistance', label: '距离剔除', type: 'checkbox' },
    ],
  },
];

// 平铺的 schema 查找表
const flatSchema = new Map();
for (const group of schema) {
  for (const item of group.items) flatSchema.set(item.key, item);
}

// ============================================================
// 加载已保存配置
// ============================================================
const STORAGE_KEY = 'dynamicGrassConfig_v3';
const config = { ...defaultConfig };

(function loadFromStorage() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) return;
  try {
    const data = JSON.parse(saved);
    for (const k of Object.keys(defaultConfig)) {
      if (k in data) config[k] = data[k];
    }
  } catch(_) { /* ignore */ }
})();

function queueSave() {
  clearTimeout(queueSave._t);
  queueSave._t = setTimeout(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(config)); } catch(_) {}
  }, 500);
}

// ============================================================
// 场景
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(config.skyColor);
scene.fog = new THREE.Fog(config.fogColor, config.fogNear, config.fogFar);

const camera = new THREE.PerspectiveCamera(config.cameraFov, innerWidth / innerHeight, 0.1, 800);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// 光照
const dirLight = new THREE.DirectionalLight(config.sunColor, config.sunIntensity);
scene.add(dirLight);
const ambientLight = new THREE.AmbientLight(config.ambientLightColor, config.ambientLightIntensity);
scene.add(ambientLight);

// 地面
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(240, 240),
  new THREE.MeshBasicMaterial({ color: 0x14331a })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
scene.add(ground);

// 相机状态
const cam = { yaw: 0, pitch: -0.3, isFirstPerson: false };

// 球
const ball = {
  position: new THREE.Vector3(0, config.hoverHeight, 0),
  mesh: null,
};

// ============================================================
// 草叶几何体 & 材质
// ============================================================
function createBladeGeometry(segments = 4) {
  const geo = new THREE.BufferGeometry();
  const positions = [], uvs = [], indices = [];
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const hw = 0.08 * (1.0 - t * 0.92);
    positions.push(-hw, t, 0); uvs.push(0, t);
    positions.push( hw, t, 0); uvs.push(1, t);
  }
  for (let i = 0; i < segments; i++) {
    const a = i*2, b = i*2+1, c = i*2+2, d = i*2+3;
    indices.push(a, c, b, b, c, d);
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}
const sharedBladeGeo = createBladeGeometry(4);

const vertexShader = /* glsl */`
uniform float uTime;
uniform vec2  uWindDir;
uniform float uWindStrength;
uniform float uWindSpeed;
uniform float uShakeBending;
uniform float uWindDirRate;
uniform vec3  uObstaclePos;
uniform float uEffectRadius;
uniform float uOffsetMultiplier;
uniform float uGravityMultiplier;

varying vec2  vUv;
varying float vHeight;

void main() {
  vUv = uv;
  vHeight = uv.y;

  vec4 worldPos = modelMatrix * instanceMatrix * vec4(position, 1.0);
  vec3 center   = (modelMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
  float h = uv.y;

  const vec4 waveXSize = vec4(0.048, 0.06,  0.24, 0.096);
  const vec4 waveZSize = vec4(0.024, 0.08,  0.08, 0.200);
  const vec4 waveSpeed = vec4(1.2,   2.0,   1.6,  4.8);
  const vec4 waveXmove = vec4(0.024, 0.04, -0.12, 0.096);
  const vec4 waveZmove = vec4(0.006, 0.02, -0.02, 0.100);

  vec4 waves = center.x * waveXSize + center.z * waveZSize;
  waves += uTime * waveSpeed * uWindSpeed;
  waves = fract(waves);

  vec4 s = sin(waves * 6.408849 - 3.1415927);
  s *= h * uShakeBending;
  s *= normalize(waveSpeed);

  float windDirX = uWindDir.x * uWindStrength;
  float windDirZ = uWindDir.y * uWindStrength;

  vec3 waveMove;
  waveMove.x = dot(s, waveXmove) * windDirX * 3.0;
  waveMove.z = dot(s, waveZmove) * windDirZ * 3.0;
  waveMove.y = 0.0;

  vec3 windDirOffset = vec3(windDirX, 0.0, windDirZ) * uWindDirRate * h;
  worldPos.xz += waveMove.xz + windDirOffset.xz;

  vec3 diff = worldPos.xyz - uObstaclePos;
  diff.y = 0.0;
  float dist = length(diff);
  vec3 bendDir = dist > 0.0001 ? normalize(diff) : vec3(1.0, 0.0, 0.0);
  float effectRate = clamp(uEffectRadius - dist, 0.0, uEffectRadius);
  float effectNorm = effectRate / max(uEffectRadius, 0.001);
  vec3 bendForce = bendDir * effectNorm * uOffsetMultiplier * h * 0.6;
  worldPos.xz += bendForce.xz;

  float horizontalForce = length(waveMove.xz + windDirOffset.xz + bendForce.xz);
  worldPos.y -= horizontalForce * uGravityMultiplier * h;

  gl_Position = projectionMatrix * viewMatrix * worldPos;
}
`;

const fragmentShader = /* glsl */`
uniform vec3 uColorTop;
uniform vec3 uColorBottom;
uniform vec3 uLightDir;
uniform float uAmbient;

varying vec2 vUv;
varying float vHeight;

void main() {
  vec3 col = mix(uColorBottom, uColorTop, vHeight);
  vec3 n = normalize(vec3(0.0, 1.0, 0.0));
  float ndl = max(dot(n, normalize(uLightDir)), 0.0);
  float light = uAmbient + ndl * (1.0 - uAmbient);
  float ao = mix(0.5, 1.0, vHeight);
  gl_FragColor = vec4(col * light * ao, 1.0);
}
`;

const material = new THREE.ShaderMaterial({
  vertexShader, fragmentShader,
  side: THREE.DoubleSide,
  uniforms: {
    uTime:              { value: 0 },
    uWindDir:           { value: new THREE.Vector2(1, 0) },
    uWindStrength:      { value: config.windStrength },
    uWindSpeed:         { value: config.windSpeed },
    uShakeBending:      { value: config.shake },
    uWindDirRate:       { value: config.windDirRate },
    uObstaclePos:       { value: new THREE.Vector3(0, 0, 0) },
    uEffectRadius:      { value: config.radius },
    uOffsetMultiplier:  { value: config.push },
    uGravityMultiplier: { value: config.gravity },
    uColorTop:          { value: new THREE.Color(config.colorTop) },
    uColorBottom:       { value: new THREE.Color(config.colorBottom) },
    uLightDir:          { value: new THREE.Vector3(5, 15, 6) },
    uAmbient:           { value: config.ambient },
  }
});

// ============================================================
// 确定性随机 & Chunk 流式加载
// ============================================================
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = a;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function chunkSeed(cx, cz) {
  return (Math.imul(cx, 73856093) ^ Math.imul(cz, 19349663)) ^ 0x9E3779B9;
}

const chunks = new Map();
let lastCx = null, lastCz = null;
let allChunksDirty = false;

function createGrassChunk(cx, cz) {
  const rng = mulberry32(chunkSeed(cx, cz));
  const n = config.bladesPerChunk;
  const cs = config.chunkSize;

  const mesh = new THREE.InstancedMesh(sharedBladeGeo, material, n);
  mesh.frustumCulled = false;

  const arr = mesh.instanceMatrix.array;
  for (let i = 0; i < n; i++) {
    const lx = (rng() - 0.5) * cs + (rng() - 0.5) * 0.6;
    const lz = (rng() - 0.5) * cs + (rng() - 0.5) * 0.6;
    const rotY = rng() * Math.PI * 2;
    const c = Math.cos(rotY), s = Math.sin(rotY);
    const sxz = config.size * (0.7 + rng() * 0.6);
    const sy  = config.height * (0.7 + rng() * 0.6);

    const o = i * 16;
    arr[o]    = sxz*c; arr[o+1]=0;  arr[o+2]=-sxz*s; arr[o+3]=0;
    arr[o+4]  = 0;     arr[o+5]=sy; arr[o+6]=0;      arr[o+7]=0;
    arr[o+8]  = sxz*s; arr[o+9]=0;  arr[o+10]=sxz*c; arr[o+11]=0;
    arr[o+12] = lx;    arr[o+13]=0; arr[o+14]=lz;    arr[o+15]=1;
  }
  mesh.instanceMatrix.needsUpdate = true;

  const worldCx = cx * cs + cs / 2;
  const worldCz = cz * cs + cs / 2;
  mesh.position.set(worldCx, 0, worldCz);
  mesh.updateMatrixWorld();

  const radius = cs * 0.71 + config.height * 1.8 + 2;
  const sphere = new THREE.Sphere(
    new THREE.Vector3(worldCx, config.height * 0.5, worldCz),
    radius
  );

  scene.add(mesh);
  return { mesh, cx, cz, sphere, worldCenter: sphere.center, instanceCount: n };
}

function ensureChunks(force = false) {
  const cs = config.chunkSize;
  const cx0 = Math.floor(ball.position.x / cs);
  const cz0 = Math.floor(ball.position.z / cs);
  if (!force && cx0 === lastCx && cz0 === lastCz) return false;
  lastCx = cx0;
  lastCz = cz0;

  const R = config.chunkRadius;
  const needed = new Set();

  for (let dz = -R; dz <= R; dz++) {
    for (let dx = -R; dx <= R; dx++) {
      const cx = cx0 + dx;
      const cz = cz0 + dz;
      const key = cx + ',' + cz;
      needed.add(key);
      if (!chunks.has(key)) {
        chunks.set(key, createGrassChunk(cx, cz));
      }
    }
  }

  for (const [key, chunk] of chunks) {
    if (!needed.has(key)) {
      scene.remove(chunk.mesh);
      chunk.mesh.dispose();
      chunks.delete(key);
    }
  }
  return true;
}

// ============================================================
// 球 & 阴影环
// ============================================================
ball.mesh = new THREE.Mesh(
  new THREE.SphereGeometry(0.5, 24, 24),
  new THREE.MeshStandardMaterial({ color: config.ballColor, roughness: 0.35, metalness: 0.15 })
);
ball.mesh.scale.setScalar(config.ballVisualRadius / 0.5);
scene.add(ball.mesh);

const ringMesh = new THREE.Mesh(
  new THREE.RingGeometry(0.55, 0.7, 40),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25, side: THREE.DoubleSide })
);
ringMesh.rotation.x = -Math.PI / 2;
ringMesh.position.y = 0.02;
scene.add(ringMesh);

// ============================================================
// 输入
// ============================================================
const keys = {};
addEventListener('keydown', e => {
  keys[e.key] = true; keys[e.key.toLowerCase()] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if (e.key === 'v' || e.key === 'V') toggleView();
  if (e.key === 'Escape') closePanel();
});
addEventListener('keyup', e => {
  keys[e.key] = false; keys[e.key.toLowerCase()] = false;
});

let dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  cam.yaw -= dx * 0.005;
  cam.pitch += dy * 0.005;
  cam.pitch = THREE.MathUtils.clamp(cam.pitch, -1.4, 0.5);
});
renderer.domElement.addEventListener('pointerup', e => {
  dragging = false;
  try { renderer.domElement.releasePointerCapture(e.pointerId); } catch(_) {}
});

renderer.domElement.addEventListener('wheel', e => {
  if (cam.isFirstPerson) return;
  const factor = e.deltaY > 0 ? 1.1 : 0.9;
  config.camDistance = THREE.MathUtils.clamp(config.camDistance * factor, 2.5, 30);
  syncSingleUI('camDistance');
  queueSave();
  e.preventDefault();
}, { passive: false });

// ============================================================
// 视角切换
// ============================================================
function toggleView() {
  cam.isFirstPerson = !cam.isFirstPerson;
  ball.mesh.visible = !cam.isFirstPerson;
  ringMesh.visible = !cam.isFirstPerson;
  document.getElementById('hud-mode').textContent = cam.isFirstPerson ? '第一人称' : '第三人称';
}

// ============================================================
// 球移动 + 相机跟随
// ============================================================
const _forward = new THREE.Vector3();
const _right = new THREE.Vector3();
const _move = new THREE.Vector3();
const _lookAt = new THREE.Vector3();

function updateBallAndCamera(dt, t) {
  _forward.set(-Math.sin(cam.yaw), 0, -Math.cos(cam.yaw));
  _right.set(Math.cos(cam.yaw), 0, -Math.sin(cam.yaw));
  _move.set(0, 0, 0);

  if (keys['w'] || keys['ArrowUp'])    _move.add(_forward);
  if (keys['s'] || keys['ArrowDown'])  _move.sub(_forward);
  if (keys['d'] || keys['ArrowRight']) _move.add(_right);
  if (keys['a'] || keys['ArrowLeft'])  _move.sub(_right);

  if (_move.lengthSq() > 0.001) {
    _move.normalize();
    ball.position.x += _move.x * config.ballSpeed * dt;
    ball.position.z += _move.z * config.ballSpeed * dt;
  }

  ball.position.y = config.hoverHeight + Math.sin(t * 2.5) * 0.06;
  ball.mesh.position.copy(ball.position);
  ringMesh.position.x = ball.position.x;
  ringMesh.position.z = ball.position.z;

  if (cam.isFirstPerson) {
    camera.position.set(
      ball.position.x,
      ball.position.y + config.fpEyeHeight,
      ball.position.z
    );
    const dirX = -Math.sin(cam.yaw) * Math.cos(cam.pitch);
    const dirY =  Math.sin(cam.pitch);
    const dirZ = -Math.cos(cam.yaw) * Math.cos(cam.pitch);
    camera.lookAt(
      camera.position.x + dirX,
      camera.position.y + dirY,
      camera.position.z + dirZ
    );
  } else {
    const dist = config.camDistance;
    const cosP = Math.cos(cam.pitch);
    const offX =  Math.sin(cam.yaw) * cosP * dist;
    const offY = -Math.sin(cam.pitch) * dist;
    const offZ =  Math.cos(cam.yaw) * cosP * dist;
    camera.position.set(
      ball.position.x + offX,
      ball.position.y + offY,
      ball.position.z + offZ
    );
    if (camera.position.y < 0.4) camera.position.y = 0.4;
    _lookAt.copy(ball.position);
    _lookAt.y += 2.0;
    camera.lookAt(_lookAt);
  }

  ground.position.x = Math.round(ball.position.x / 100) * 100;
  ground.position.z = Math.round(ball.position.z / 100) * 100;
}

// ============================================================
// 剔除
// ============================================================
const _frustum = new THREE.Frustum();
const _projScreen = new THREE.Matrix4();
const cullStats = { visible: 0, total: 0, blades: 0 };

function cullChunks() {
  camera.updateMatrixWorld();
  camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
  _projScreen.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  _frustum.setFromProjectionMatrix(_projScreen);

  const camPos = camera.position;
  const maxD = config.chunkRadius * config.chunkSize * 1.6;
  const maxD2 = maxD * maxD;

  let visible = 0, blades = 0;

  for (const chunk of chunks.values()) {
    if (config.cullDistance) {
      const d2 = camPos.distanceToSquared(chunk.worldCenter);
      if (d2 > maxD2) { chunk.mesh.visible = false; continue; }
    }
    if (config.cullFrustum && !_frustum.intersectsSphere(chunk.sphere)) {
      chunk.mesh.visible = false;
      continue;
    }
    chunk.mesh.visible = true;
    visible++;
    blades += chunk.instanceCount;
  }
  cullStats.visible = visible;
  cullStats.total = chunks.size;
  cullStats.blades = blades;
}

// ============================================================
// 应用配置
// ============================================================
function applyConfig(changedKey) {
  // ===== uniforms =====
  material.uniforms.uWindStrength.value = config.windStrength;
  material.uniforms.uWindSpeed.value = config.windSpeed;
  material.uniforms.uShakeBending.value = config.shake;
  material.uniforms.uWindDirRate.value = config.windDirRate;
  const rad = config.windAngle * Math.PI / 180;
  material.uniforms.uWindDir.value.set(Math.cos(rad), Math.sin(rad));
  material.uniforms.uEffectRadius.value = config.radius;
  material.uniforms.uOffsetMultiplier.value = config.push;
  material.uniforms.uGravityMultiplier.value = config.gravity;
  material.uniforms.uColorTop.value.set(config.colorTop);
  material.uniforms.uColorBottom.value.set(config.colorBottom);
  material.uniforms.uAmbient.value = config.ambient;

  // ===== 球 & 阴影环 =====
  ball.mesh.material.color.set(config.ballColor);
  ball.mesh.scale.setScalar(config.ballVisualRadius / 0.5);
  ringMesh.scale.set(config.radius, config.radius, 1);

  // ===== 相机 =====
  camera.fov = config.cameraFov;
  camera.updateProjectionMatrix();

  // ===== 光照 =====
  const sunEl = config.sunElevation * Math.PI / 180;
  const sunAz = config.sunAngle * Math.PI / 180;
  dirLight.position.set(
    Math.cos(sunEl) * Math.sin(sunAz) * 30,
    Math.sin(sunEl) * 30,
    Math.cos(sunEl) * Math.cos(sunAz) * 30
  );
  dirLight.intensity = config.sunIntensity;
  dirLight.color.set(config.sunColor);
  ambientLight.intensity = config.ambientLightIntensity;
  ambientLight.color.set(config.ambientLightColor);

  // ===== 天空 / 雾 =====
  scene.background.set(config.skyColor);
  scene.fog.color.set(config.fogColor);
  scene.fog.near = config.fogNear;
  scene.fog.far = config.fogFar;

  // ===== 重建判定 =====
  if (!changedKey) {
    // 全量应用，重建所有 chunk
    allChunksDirty = true;
    lastCx = null; lastCz = null;
  } else {
    const item = flatSchema.get(changedKey);
    if (!item) return;
    if (item.rebuild === 'full') {
      allChunksDirty = true;
    } else if (item.rebuild === 'refresh') {
      lastCx = null; lastCz = null;
    }
  }
}

// ============================================================
// UI 生成
// ============================================================
function formatValue(item, v) {
  if (item.format) return item.format(v);
  if (typeof v === 'number') return Number.isInteger(v) ? v.toString() : v.toFixed(2);
  return String(v);
}

function createRow(item) {
  const row = document.createElement('div');
  row.className = 'param-row';

  const label = document.createElement('label');
  label.textContent = item.label;
  row.appendChild(label);

  if (item.type === 'range') {
    const input = document.createElement('input');
    input.type = 'range';
    input.min = item.min;
    input.max = item.max;
    input.step = item.step;
    input.value = config[item.key];
    input.dataset.key = item.key;

    const valSpan = document.createElement('span');
    valSpan.className = 'param-val';
    valSpan.textContent = formatValue(item, config[item.key]);

    input.addEventListener('input', () => {
      config[item.key] = parseFloat(input.value);
      valSpan.textContent = formatValue(item, config[item.key]);
      applyConfig(item.key);
      queueSave();
    });

    row.appendChild(input);
    row.appendChild(valSpan);
  } else if (item.type === 'color') {
    const input = document.createElement('input');
    input.type = 'color';
    input.value = config[item.key];
    input.dataset.key = item.key;
    input.classList.add('span2');
    input.addEventListener('input', () => {
      config[item.key] = input.value;
      applyConfig(item.key);
      queueSave();
    });
    row.appendChild(input);
  } else if (item.type === 'checkbox') {
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = config[item.key];
    input.dataset.key = item.key;
    input.classList.add('span2');
    input.addEventListener('change', () => {
      config[item.key] = input.checked;
      applyConfig(item.key);
      queueSave();
    });
    row.appendChild(input);
  }

  return row;
}

function buildPanel() {
  const content = document.getElementById('panelContent');
  content.innerHTML = '';
  for (const group of schema) {
    const title = document.createElement('div');
    title.className = 'group-title';
    title.textContent = group.title;
    content.appendChild(title);
    for (const item of group.items) {
      content.appendChild(createRow(item));
    }
  }
}

function syncUI() {
  document.querySelectorAll('#panelContent [data-key]').forEach(el => {
    const key = el.dataset.key;
    if (el.type === 'checkbox') {
      el.checked = config[key];
    } else {
      el.value = config[key];
    }
    if (el.type === 'range') {
      const item = flatSchema.get(key);
      const row = el.closest('.param-row');
      const val = row.querySelector('.param-val');
      if (val && item) val.textContent = formatValue(item, config[key]);
    }
  });
}

function syncSingleUI(key) {
  const el = document.querySelector(`#panelContent [data-key="${key}"]`);
  if (!el) return;
  if (el.type === 'checkbox') { el.checked = config[key]; return; }
  el.value = config[key];
  if (el.type === 'range') {
    const item = flatSchema.get(key);
    const row = el.closest('.param-row');
    const val = row.querySelector('.param-val');
    if (val && item) val.textContent = formatValue(item, config[key]);
  }
}

// ============================================================
// 面板开关
// ============================================================
const panelEl = document.getElementById('panel');
const overlayEl = document.getElementById('overlay');

function openPanel() {
  panelEl.classList.add('open');
  overlayEl.classList.add('open');
}
function closePanel() {
  panelEl.classList.remove('open');
  overlayEl.classList.remove('open');
}
document.getElementById('openPanel').addEventListener('click', openPanel);
document.getElementById('closePanel').addEventListener('click', closePanel);
overlayEl.addEventListener('click', closePanel);

// ============================================================
// 保存 / 导出 / 导入 / 重置 / 预设
// ============================================================
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

document.getElementById('saveBtn').addEventListener('click', () => {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
  toast('配置已保存到本地');
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('确定重置为默认配置？')) return;
  Object.assign(config, { ...defaultConfig });
  syncUI();
  applyConfig();
  queueSave();
  toast('已重置为默认');
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `grass-config-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出 JSON');
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      for (const k of Object.keys(defaultConfig)) {
        if (k in data) config[k] = data[k];
      }
      syncUI();
      applyConfig();
      queueSave();
      toast('配置导入成功');
    } catch(err) {
      toast('导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('presetSelect').addEventListener('change', (e) => {
  const key = e.target.value;
  if (!key || !presets[key]) return;
  Object.assign(config, presets[key]);
  syncUI();
  applyConfig();
  queueSave();
  toast(`已切换到「${e.target.options[e.target.selectedIndex].text}」预设`);
});

// ============================================================
// 初始化
// ============================================================
buildPanel();
applyConfig();          // 首次应用（含重建判定）
ensureChunks(true);

// ============================================================
// 主循环
// ============================================================
const clock = new THREE.Clock();
let fpsAcc = 0, fpsFrames = 0, fpsDisplay = 0;
let lastHudUpdate = 0;

const hudFps = document.getElementById('hud-fps');
const hudPos = document.getElementById('hud-pos');
const hudChunks = document.getElementById('hud-chunks');
const hudVisible = document.getElementById('hud-visible');
const hudBlades = document.getElementById('hud-blades');

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.getElapsedTime();

  fpsAcc += dt; fpsFrames++;
  if (fpsAcc >= 0.5) {
    fpsDisplay = Math.round(fpsFrames / fpsAcc);
    fpsAcc = 0; fpsFrames = 0;
  }

  updateBallAndCamera(dt, t);

  material.uniforms.uTime.value = t;
  material.uniforms.uObstaclePos.value.copy(ball.position);

  // 重建 chunk（仅参数改变时）
  if (allChunksDirty) {
    for (const chunk of chunks.values()) {
      scene.remove(chunk.mesh);
      chunk.mesh.dispose();
    }
    chunks.clear();
    lastCx = null; lastCz = null;
    ensureChunks(true);
    allChunksDirty = false;
  } else {
    ensureChunks();
  }

  cullChunks();
  renderer.render(scene, camera);

  if (t - lastHudUpdate > 0.2) {
    lastHudUpdate = t;
    hudFps.textContent = fpsDisplay;
    hudPos.textContent = `${ball.position.x.toFixed(1)}, ${ball.position.z.toFixed(1)}`;
    hudChunks.textContent = cullStats.total;
    hudVisible.textContent = cullStats.visible;
    hudBlades.textContent = cullStats.blades.toLocaleString();
  }
}

animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
